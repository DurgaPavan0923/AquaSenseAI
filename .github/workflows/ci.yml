name: AquaSense AI Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: Code Quality & Typing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting & Quality Tools
        run: |
          pip install --upgrade pip
          pip install ruff mypy types-requests types-PyYAML

      - name: Run Ruff Linter
        run: |
          python -m ruff check src/aquasense api tests scripts

      - name: Run Mypy Type Checker
        run: |
          python -m mypy src/aquasense api scripts --ignore-missing-imports

  verification-and-tests:
    name: Verification & Pytest Suite
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-train.txt

      - name: Design & Typography Audit
        run: |
          python scripts/lint_design.py

      - name: Serverless Bundle Size Audit (< 250 MB)
        run: |
          python scripts/check_bundle_size.py

      - name: Execute Pytest Suite with Coverage
        run: |
          python -m pytest --cov=src/aquasense --cov=api --cov-fail-under=80
