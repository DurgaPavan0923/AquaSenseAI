[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquasense-ai"
version = "1.0.0"
description = "Explainable Water-Quality Monitoring & Pollution-Risk Prediction Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AquaSense AI Research Team", email = "contact@aquasense-ai.local" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Hydrology"
]
dependencies = [
    "fastapi>=0.109.0",
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.2"
]

[project.optional-dependencies]
dev = [
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "xgboost>=2.0.0",
    "shap>=0.44.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "streamlit>=1.31.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "sqlalchemy>=2.0.25",
    "pyyaml>=6.0.1",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.6",
    "requests>=2.31.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "E402", "B007", "F841", "W293", "B008", "B904", "B905", "E712"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "silent"
disable_error_code = ["operator", "union-attr", "arg-type", "assignment", "no-any-return", "name-defined"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src/aquasense --cov=api --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.coverage.run]
omit = [
    "src/aquasense/train.py",
    "src/aquasense/evaluate.py",
    "src/aquasense/db.py",
    "notebooks/*",
    "app/*",
    "scripts/*",
    "tests/*"
]

[tool.vercel]
entrypoint = "api.index:app"
